name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A branch with an open PR used to enqueue both a push run and a PR run for
# every commit. Hosted runners then spent 15 minutes trying to acquire the
# duplicate job. Keep one newest quality run per source branch instead.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate content data
        run: pnpm validate-data

      - name: Test (with coverage)
        run: pnpm test:cov

      - name: Build
        run: pnpm build
