<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170904" />

    <!--
      The two faces that carry the card are preloaded from /public, where Vite
      leaves filenames untouched. Hashed asset URLs cannot be preloaded from a
      static tag like this one.
    -->
    <link rel="preload" href="/fonts/cormorant-sc-600.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/cormorant-sc-500.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <title>Erdafa Andikri — Software Engineer</title>
    <meta
      name="description"
      content="The business card of Erdafa Andikri — software engineer in Jakarta, Indonesia."
    />
    <meta name="author" content="Erdafa Andikri" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.dafandikri.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dafandikri.dev/" />
    <meta property="og:title" content="Erdafa Andikri — Software Engineer" />
    <meta
      property="og:description"
      content="The business card of Erdafa Andikri — software engineer in Jakarta, Indonesia."
    />
    <meta property="og:image" content="https://www.dafandikri.dev/og-card.png" />
    <meta property="og:image:alt" content="Erdafa Andikri software engineer portfolio" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Erdafa Andikri" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Erdafa Andikri — Software Engineer" />
    <meta
      name="twitter:description"
      content="The business card of Erdafa Andikri — software engineer in Jakarta, Indonesia."
    />
    <meta name="twitter:image" content="https://www.dafandikri.dev/og-card.png" />
    <meta name="twitter:image:alt" content="Erdafa Andikri software engineer portfolio" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Erdafa Andikri",
        "url": "https://www.dafandikri.dev/",
        "image": "https://www.dafandikri.dev/profile.png",
        "jobTitle": "Software Engineer",
        "email": "mailto:dafandikri@gmail.com",
        "homeLocation": {
          "@type": "Place",
          "name": "Jakarta, Indonesia"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Universitas Indonesia"
        },
        "sameAs": [
          "https://github.com/dafandikri",
          "https://linkedin.com/in/dafandikri",
          "https://instagram.com/dafandikri"
        ]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-card.png" />

    <!-- Painted before the stylesheet loads, so the first frame already matches
         the finished page rather than flashing another colour. -->
    <style>
      html {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
